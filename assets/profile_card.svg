<svg xmlns="http://www.w3.org/2000/svg" width="700" height="720" viewBox="0 0 700 720" font-family="JetBrains Mono, Fira Code, monospace">
  <defs>
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Scanline pattern -->
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="1" fill="white" opacity="0.02"/>
    </pattern>
    <!-- Gradient for border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#ff00aa"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="720" fill="#0a0a0f" rx="12"/>

  <!-- CRT Scanlines overlay -->
  <rect width="700" height="720" fill="url(#scanlines)">
    <animate attributeName="y" from="0" to="4" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Animated border -->
  <rect x="1" y="1" width="698" height="718" rx="11" fill="none" stroke="url(#borderGrad)" stroke-width="2" filter="url(#glow)">
